<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Dropdown</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .dropdown {
            position: relative;
            display: inline-block;
        }
        .dropdown-btn {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            padding: 10px;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            background: white;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            min-width: 150px;
            z-index: 1;
            border-radius: 5px;
            overflow: hidden;
        }
        .dropdown-content a {
            display: block;
            padding: 10px;
            text-decoration: none;
            color: black;
        }
        .dropdown-content a:hover {
            background: #f1f1f1;
        }
        .search-container {
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #ccc;
            padding: 5px 10px;
            border-radius: 20px;
            width: 250px;
        }
        .search-container input {
            border: none;
            outline: none;
            flex: 1;
        }
    </style>
</head>
<body>

    <div class="dropdown">
        <button class="dropdown-btn" onclick="toggleDropdown()">Explore ▼</button>
        <div class="dropdown-content" id="dropdown">
            <a href="#">HTML</a>
            <a href="#">CSS</a>
            <a href="#">JavaScript</a>
            <a href="#">React</a>
            <a href="#">Python</a>
        </div>
    </div>

    <div class="search-container">
        <input type="text" placeholder="What do you want to learn?" />
        🔍
    </div>

    <script>
        function toggleDropdown() {
            let dropdown = document.getElementById("dropdown");
            dropdown.style.display = dropdown.style.display === "block" ? "none" : "block";
        }

        // Close dropdown when clicking outside
        window.onclick = function(event) {
            if (!event.target.matches('.dropdown-btn')) {
                document.getElementById("dropdown").style.display = "none";
            }
        };
    </script>

</body>
</html>
