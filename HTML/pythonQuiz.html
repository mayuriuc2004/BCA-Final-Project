<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Quiz</title>
  <link rel="stylesheet" href="../CSS/style1.css">
</head>
<body>
  <div class="wrapper">
    <header>
      <h4>Python Quizes</h4>
      <div class="Timer">
        <p>Time Left</p>
        <p>15</p>
      </div>
    </header>
    <div class="timer-progress">
      <div class="inner"></div>
    </div>
    <div class="question-container">
    </div>
    <div class="option-container">
    </div>
    <div class="status">
      <p class="question-num">
        <span class="current-question">1</span>
        <span>of</span>
        <span class="total-question">8 </span>
        <span>Questions</span>
      </p>
      <div class="btn">
        <button>Next</button>
      </div>
    </div>
  </div>
  <div class="result">
  <div class="result-card">
    <header>
      <p class="head">Result</p>
    </header>
    <div class="image">
      <div class="user-score">
        <p class="value">30</p>
        <p>Your Score</p>
      </div>
    </div>
    <div class="score">
      <div class="total-score">
        <p class="value">50</p>
        <p>Total Score</p>
      </div>
      <div class="attempted">
        <p class="value">27</p>
        <p>Attempted</p>
      </div>
      <div class="unattempted">
        <p class="value">23</p>
        <p>Unattempted</p>
      </div>
      <div class="wrong">
        <p class="value">10</p>
        <p>Wrong</p>
      </div>
    </div>
    <div class="score-btn">
      <button class="replay">Replay Quiz</button>
      <button class="exit">Exit Quiz</button>
    </div>
  </div>
  </div>
  <script src="../JS/pythonQuiz.js"></script>
</body>
</html>
